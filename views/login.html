<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guest Accommodations &amp; Reservations | Sugo Grand Palace Hotel</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: #0F172A;
      color: #F8FAFC;
      font-family: 'Plus Jakarta Sans', sans-serif;
      position: relative;
      overflow-x: hidden;
    }
    .login-hero-bg {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.82) 0%, rgba(30, 41, 59, 0.88) 100%),
                  url('/assets/login-bg.jpg') center/cover no-repeat;
      background-attachment: fixed;
      z-index: 1;
    }
    .login-wrapper {
      position: relative;
      z-index: 2;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .login-card {
      width: 100%;
      max-width: 480px;
      background: rgba(15, 23, 42, 0.84);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(217, 119, 6, 0.35);
      border-radius: 22px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 30px rgba(217, 119, 6, 0.1);
      padding: 40px 36px;
      animation: cardEnter 0.45s ease-out;
    }
    @keyframes cardEnter {
      from { opacity: 0; transform: translateY(16px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .brand-crest-box {
      text-align: center;
      margin-bottom: 26px;
    }
    .brand-logo-img {
      width: 72px;
      height: 72px;
      margin: 0 auto 12px;
      display: block;
      filter: drop-shadow(0 6px 14px rgba(217, 119, 6, 0.45));
      border-radius: 12px;
    }
    .hotel-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 24px;
      font-weight: 700;
      color: #FEF3C7;
      letter-spacing: 1px;
      margin-bottom: 4px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.4);
    }
    .hotel-subtitle {
      font-size: 11px;
      color: #94A3B8;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 600;
    }
    .guest-welcome-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: rgba(254, 243, 199, 0.08);
      border: 1px solid rgba(251, 191, 36, 0.25);
      padding: 8px 14px;
      border-radius: 9999px;
      margin-bottom: 24px;
      font-size: 12px;
      color: #FEF3C7;
      font-weight: 600;
    }
    .input-label {
      font-size: 13px;
      font-weight: 600;
      color: #E2E8F0;
      margin-bottom: 8px;
      display: block;
    }
    .portal-input {
      width: 100%;
      padding: 13px 16px;
      background: rgba(30, 41, 59, 0.75);
      border: 1px solid #334155;
      border-radius: 10px;
      color: #FFFFFF;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }
    .portal-input:focus {
      border-color: #D97706;
      box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.25);
      background: rgba(30, 41, 59, 0.95);
    }
    .btn-gold-primary {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #D97706, #B45309);
      color: #FFFFFF;
      font-weight: 700;
      font-size: 14px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 18px rgba(217, 119, 6, 0.35);
      text-decoration: none;
    }
    .btn-gold-primary:hover {
      background: linear-gradient(135deg, #B45309, #92400E);
      transform: translateY(-1px);
      box-shadow: 0 8px 22px rgba(217, 119, 6, 0.45);
    }
    .btn-ghost-secondary {
      width: 100%;
      padding: 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #FEF3C7;
      font-weight: 600;
      font-size: 13px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      margin-top: 12px;
      transition: all 0.2s;
    }
    .btn-ghost-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(217, 119, 6, 0.4);
      color: #FFFFFF;
    }
    .staff-portal-divider {
      display: flex;
      align-items: center;
      margin: 24px 0 16px;
      color: #475569;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 700;
    }
    .staff-portal-divider::before,
    .staff-portal-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
    }
    .staff-portal-divider span {
      padding: 0 12px;
    }
    .btn-staff-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      color: #CBD5E1;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-staff-link:hover {
      background: rgba(30, 41, 59, 0.9);
      border-color: rgba(217, 119, 6, 0.5);
      color: #FEF3C7;
    }
    .staff-pill-tag {
      background: rgba(217, 119, 6, 0.18);
      color: #FCD34D;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
    }
    .card-footer-info {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: #94A3B8;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 18px;
    }
  </style>
</head>
<body>

  <div class="login-hero-bg"></div>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="brand-crest-box">
        <img src="/assets/logo.png" alt="Sugo Crest" class="brand-logo-img"
             onerror="this.src='/assets/logo_transparent.png'; this.onerror=function(){this.src='/assets/logo.svg'}">
        <h1 class="hotel-title">SUGO GRAND PALACE</h1>
        <div class="hotel-subtitle">Luxury Hotel &amp; Residences &bull; Cagayan De Oro City, Philippines</div>
      </div>

      <div class="guest-welcome-badge">
        <span>✨ Welcome to Guest Accommodations &amp; Reservations</span>
      </div>

      <form action="/guest" method="GET">
        <input type="hidden" name="tab" value="lookup">
        <div style="margin-bottom: 18px;">
          <label class="input-label">Find Your Reservation or Booking</label>
          <input type="text" name="query" class="portal-input" placeholder="Booking ID (e.g. SH-1024) or Guest Name...">
        </div>

        <button type="submit" class="btn-gold-primary">
          Find My Reservation
        </button>

        <a href="/guest" class="btn-ghost-secondary">
          Browse Luxury Suites &amp; Book Now
        </a>
      </form>

      <div class="staff-portal-divider">
        <span>Hotel Staff Access</span>
      </div>

      <a href="/login/receptionist" class="btn-staff-link">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span>💼</span>
          <span>Receptionist Login</span>
        </div>
        <span class="staff-pill-tag">Staff Only</span>
      </a>

      <div class="card-footer-info">
        <span>Cagayan De Oro City, Philippines &bull; Front Desk: +63 (088) 888-7846</span>
      </div>

    </div>
  </div>

</body>
</html>
