<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="wallGradSingle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="floorGradSingle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="bedCoverSingle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="headboardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <radialGradient id="lampGlowSingle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Wall -->
  <rect width="800" height="340" fill="url(#wallGradSingle)" />

  <!-- Floor (Rich Parquet style) -->
  <rect y="340" width="800" height="160" fill="url(#floorGradSingle)" />
  <line x1="0" y1="340" x2="800" y2="340" stroke="#0F172A" stroke-width="4" />

  <!-- City View Window -->
  <g transform="translate(480, 40)">
    <!-- Window Frame -->
    <rect width="260" height="230" fill="#030712" rx="6" stroke="#94A3B8" stroke-width="6" />
    <!-- Window View Skyline -->
    <rect x="20" y="80" width="40" height="150" fill="#1E293B" />
    <rect x="70" y="50" width="55" height="180" fill="#334155" />
    <rect x="135" y="90" width="45" height="140" fill="#1E293B" />
    <rect x="190" y="30" width="50" height="200" fill="#475569" />
    <!-- Sky Glow -->
    <circle cx="215" cy="40" r="14" fill="#FBBF24" opacity="0.6" />
    <!-- City Windows dots -->
    <circle cx="85" cy="70" r="2" fill="#FDE68A" />
    <circle cx="95" cy="90" r="2" fill="#FDE68A" />
    <circle cx="205" cy="60" r="2" fill="#FDE68A" />
    <circle cx="220" cy="80" r="2" fill="#FDE68A" />
    <!-- Window Panes -->
    <line x1="130" y1="0" x2="130" y2="230" stroke="#94A3B8" stroke-width="3" />
    <line x1="0" y1="115" x2="260" y2="115" stroke="#94A3B8" stroke-width="3" />
    <!-- Drapes / Curtains -->
    <path d="M 0 0 C 20 60 5 180 0 230 L 30 230 C 25 180 40 60 20 0 Z" fill="#D97706" opacity="0.4" />
    <path d="M 260 0 C 240 60 255 180 260 230 L 230 230 C 235 180 220 60 240 0 Z" fill="#D97706" opacity="0.4" />
  </g>

  <!-- Wall Artwork -->
  <g transform="translate(140, 60)">
    <rect width="180" height="110" fill="#0F172A" rx="4" stroke="#D97706" stroke-width="3" />
    <!-- Modern Minimalist Abstract Art -->
    <circle cx="90" cy="55" r="35" fill="none" stroke="#F59E0B" stroke-width="2" />
    <line x1="40" y1="75" x2="140" y2="35" stroke="#E2E8F0" stroke-width="2" />
    <circle cx="65" cy="45" r="8" fill="#D97706" />
  </g>

  <!-- Lamp Glow & Light -->
  <circle cx="90" cy="220" r="90" fill="url(#lampGlowSingle)" />

  <!-- Nightstand Table -->
  <g transform="translate(60, 260)">
    <rect width="70" height="90" fill="#1E293B" rx="4" stroke="#475569" stroke-width="1.5" />
    <line x1="7" y1="30" x2="63" y2="30" stroke="#64748B" stroke-width="1.5" />
    <circle cx="35" cy="15" r="3" fill="#D97706" />
    <!-- Lamp -->
    <rect x="28" y="-55" width="14" height="55" fill="#CBD5E1" />
    <polygon points="15,-55 55,-55 45,-90 25,-90" fill="#FEF3C7" stroke="#D97706" stroke-width="1" />
  </g>

  <!-- Single Bed Structure -->
  <g transform="translate(150, 190)">
    <!-- Headboard -->
    <rect x="0" y="0" width="280" height="130" fill="url(#headboardGrad)" rx="8" stroke="#D97706" stroke-width="2" />
    <line x1="20" y1="20" x2="260" y2="20" stroke="#64748B" stroke-width="1" stroke-dasharray="4" />
    <line x1="20" y1="60" x2="260" y2="60" stroke="#64748B" stroke-width="1" stroke-dasharray="4" />

    <!-- Plush Pillows -->
    <rect x="35" y="65" width="95" height="45" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
    <rect x="150" y="65" width="95" height="45" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
    <!-- Decorative Gold Accent Cushion -->
    <rect x="95" y="85" width="90" height="30" rx="6" fill="#D97706" />

    <!-- Mattress Base -->
    <rect x="10" y="110" width="260" height="150" fill="url(#bedCoverSingle)" rx="10" stroke="#CBD5E1" stroke-width="1" />
    
    <!-- Gold Bed Runner at Foot -->
    <rect x="10" y="210" width="260" height="45" fill="#B45309" rx="4" />
    
    <!-- Bed Legs -->
    <rect x="25" y="260" width="12" height="15" fill="#0F172A" />
    <rect x="243" y="260" width="12" height="15" fill="#0F172A" />
  </g>

  <!-- Work Desk with Ergonomic Chair & Laptop -->
  <g transform="translate(520, 290)">
    <rect width="180" height="16" fill="#334155" rx="2" stroke="#64748B" stroke-width="1" />
    <rect x="15" y="16" width="8" height="85" fill="#1E293B" />
    <rect x="157" y="16" width="8" height="85" fill="#1E293B" />
    <!-- Laptop -->
    <polygon points="70,16 115,16 112,0 73,0" fill="#94A3B8" />
    <rect x="68" y="14" width="48" height="4" fill="#64748B" />
    <!-- Desk Lamp -->
    <path d="M 145 16 L 145 -30 L 125 -40" stroke="#CBD5E1" stroke-width="3" fill="none" />
    <polygon points="120,-48 135,-35 125,-28" fill="#FDE68A" />
  </g>

  <!-- Badge Overlay -->
  <rect x="25" y="25" width="170" height="36" rx="18" fill="rgba(15, 23, 42, 0.85)" stroke="#D97706" stroke-width="1.5" />
  <text x="110" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" 
        fill="#FFFFFF" text-anchor="middle">🛏️ SINGLE ROOM</text>
</svg>

