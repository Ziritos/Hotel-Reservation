<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="wallGradPres" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B0764" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="marbleFloor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <radialGradient id="presChandelier" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="1" />
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#B45309" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Penthouse High Ceiling Walls -->
  <rect width="800" height="340" fill="url(#wallGradPres)" />
  <!-- Italian Marble Floor -->
  <rect y="340" width="800" height="160" fill="url(#marbleFloor)" />
  <!-- Marble veins -->
  <path d="M 0 380 Q 200 360 400 420 T 800 370" stroke="#94A3B8" stroke-width="1.5" fill="none" opacity="0.4" />
  <path d="M 100 450 Q 300 400 500 470 T 750 430" stroke="#94A3B8" stroke-width="1.2" fill="none" opacity="0.3" />

  <!-- Panoramic Floor-to-Ceiling 360 Penthouse Glass -->
  <g transform="translate(40, 20)">
    <rect width="720" height="230" fill="#020617" rx="8" stroke="#F59E0B" stroke-width="3" />
    <!-- Golden Twilight Sky -->
    <rect width="720" height="130" fill="linear-gradient(to bottom, #1E1B4B, #4C1D95)" />
    <!-- Stars & Moon in Penthouse view -->
    <circle cx="640" cy="50" r="18" fill="#FEF08A" />
    <!-- Mega City Skyline -->
    <rect x="30" y="70" width="60" height="160" fill="#0F172A" />
    <rect x="110" y="40" width="70" height="190" fill="#1E293B" />
    <rect x="200" y="90" width="55" height="140" fill="#0F172A" />
    <rect x="275" y="30" width="80" height="200" fill="#312E81" />
    <rect x="375" y="80" width="65" height="150" fill="#1E293B" />
    <rect x="460" y="50" width="75" height="180" fill="#0F172A" />
    <rect x="555" y="75" width="60" height="155" fill="#312E81" />
    <!-- City Golden Windows -->
    <circle cx="140" cy="65" r="3" fill="#FDE68A" />
    <circle cx="310" cy="55" r="3" fill="#FDE68A" />
    <circle cx="490" cy="75" r="3" fill="#FDE68A" />
    <!-- Massive Glass Mullions -->
    <line x1="180" y1="0" x2="180" y2="230" stroke="#D97706" stroke-width="3" />
    <line x1="360" y1="0" x2="360" y2="230" stroke="#D97706" stroke-width="3" />
    <line x1="540" y1="0" x2="540" y2="230" stroke="#D97706" stroke-width="3" />
  </g>

  <!-- Crystal Cascade Chandelier -->
  <circle cx="400" cy="90" r="140" fill="url(#presChandelier)" />
  <g transform="translate(360, 0)">
    <line x1="40" y1="0" x2="40" y2="40" stroke="#F59E0B" stroke-width="4" />
    <polygon points="40,40 10,70 70,70" fill="none" stroke="#FBBF24" stroke-width="2" />
    <circle cx="40" cy="55" r="8" fill="#FFFBEB" />
    <circle cx="20" cy="70" r="6" fill="#FFFBEB" />
    <circle cx="40" cy="75" r="7" fill="#FFFBEB" />
    <circle cx="60" cy="70" r="6" fill="#FFFBEB" />
    <circle cx="40" cy="95" r="5" fill="#FDE68A" />
  </g>

  <!-- Dual Master King Bed Structure (Royal Penthouse Edition) -->
  <g transform="translate(240, 150)">
    <!-- Royal Tufted Headboard with Gold Trim -->
    <rect x="0" y="0" width="320" height="160" fill="#1E1B4B" rx="14" stroke="#F59E0B" stroke-width="3.5" />
    <!-- Diamond tufting lines -->
    <path d="M 0 40 L 40 0 M 0 80 L 80 0 M 0 120 L 120 0 M 40 160 L 200 0 M 120 160 L 280 0 M 200 160 L 320 40 M 280 160 L 320 120" 
          stroke="#F59E0B" stroke-width="1" stroke-dasharray="2,4" opacity="0.6" />

    <!-- 6 Royal Pillows -->
    <rect x="25" y="70" width="80" height="45" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <rect x="120" y="70" width="80" height="45" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <rect x="215" y="70" width="80" height="45" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <rect x="60" y="95" width="85" height="32" rx="6" fill="#F59E0B" />
    <rect x="175" y="95" width="85" height="32" rx="6" fill="#F59E0B" />

    <!-- King Mattress & Silk Bedding -->
    <rect x="10" y="130" width="300" height="180" fill="#FFFFFF" rx="10" stroke="#CBD5E1" stroke-width="1" />
    <!-- Regal Purple & Gold Silk Bed Runner -->
    <rect x="10" y="245" width="300" height="55" fill="#4C1D95" rx="4" stroke="#F59E0B" stroke-width="2" />
    <!-- Gold Crown Monogram on Runner -->
    <text x="160" y="280" font-family="'Playfair Display', serif" font-size="20" font-weight="bold" 
          fill="#FDE68A" text-anchor="middle">👑 SUGO PENTHOUSE</text>
  </g>

  <!-- Jacuzzi Terrace / Champagne Bar (Left Side) -->
  <g transform="translate(60, 270)">
    <rect width="130" height="90" fill="#0F172A" rx="8" stroke="#F59E0B" stroke-width="2" />
    <text x="65" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" 
          fill="#FDE68A" text-anchor="middle">PRIVATE BAR</text>
    <rect x="20" y="45" width="90" height="8" rx="2" fill="#38BDF8" opacity="0.8" />
    <circle cx="65" cy="70" r="10" fill="#F59E0B" />
  </g>

  <!-- VIP Butler Service Station (Right Side) -->
  <g transform="translate(610, 270)">
    <rect width="130" height="90" fill="#0F172A" rx="8" stroke="#F59E0B" stroke-width="2" />
    <text x="65" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" 
          fill="#FDE68A" text-anchor="middle">BUTLER CONCIERGE</text>
    <circle cx="65" cy="65" r="14" fill="#6D28D9" stroke="#F59E0B" stroke-width="1.5" />
    <text x="65" y="70" font-size="14" text-anchor="middle" fill="#FFFFFF">🛎️</text>
  </g>

  <!-- Badge Overlay -->
  <rect x="25" y="25" width="220" height="38" rx="19" fill="rgba(30, 27, 75, 0.95)" stroke="#F59E0B" stroke-width="2" />
  <text x="135" y="49" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" 
        fill="#FDE68A" text-anchor="middle">👑 PRESIDENTIAL SUITE</text>
</svg>

