<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- Crest Shield -->
  <g transform="translate(15, 10)">
    <!-- Outer Shield Frame -->
    <path d="M 50 5 Q 90 5 90 45 C 90 75 50 95 50 95 C 50 95 10 75 10 45 Q 10 5 50 5 Z" 
          fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="3" />
    
    <!-- Inner Golden Border -->
    <path d="M 50 12 Q 82 12 82 45 C 82 68 50 85 50 85 C 50 85 18 68 18 45 Q 18 12 50 12 Z" 
          fill="none" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.6" />

    <!-- Hotel Palace Towers / Crown -->
    <path d="M 32 55 L 32 38 L 40 44 L 50 30 L 60 44 L 68 38 L 68 55 Z" fill="url(#goldGrad)" />
    
    <!-- Stars -->
    <polygon points="50,18 52,24 58,24 53,28 55,34 50,30 45,34 47,28 42,24 48,24" fill="#FDE68A" />
    
    <!-- Monogram 'S' -->
    <text x="50" y="74" font-family="'Playfair Display', serif" font-size="18" font-weight="bold" 
          text-anchor="middle" fill="#FFFFFF" letter-spacing="1">S</text>
  </g>

  <!-- Typography -->
  <g transform="translate(130, 20)">
    <!-- 5 Stars Rating -->
    <g transform="translate(0, 10)" fill="#F59E0B">
      <polygon points="6,0 8,5 13,5 9,8 11,13 6,10 2,13 4,8 0,5 5,5" />
      <polygon points="22,0 24,5 29,5 25,8 27,13 22,10 18,13 20,8 16,5 21,5" />
      <polygon points="38,0 40,5 45,5 41,8 43,13 38,10 34,13 36,8 32,5 37,5" />
      <polygon points="54,0 56,5 61,5 57,8 59,13 54,10 50,13 52,8 48,5 53,5" />
      <polygon points="70,0 72,5 77,5 73,8 75,13 70,10 66,13 68,8 64,5 69,5" />
    </g>

    <!-- Main Title -->
    <text x="0" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" 
          fill="#0F172A" letter-spacing="2">SUGO GRAND PALACE</text>
    
    <!-- Subtitle -->
    <text x="2" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" 
          fill="#D97706" letter-spacing="3">LUXURY HOTEL &amp; SUITES • CAGAYAN DE ORO</text>
  </g>
</svg>

